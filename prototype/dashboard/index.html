<!doctype html>
<!--
  PROTOTYPE — throwaway, round 2. Wayfinder ticket "What should the dashboard look like?"
  Round 1 (4 variants with a Cost meter) was rejected: Cost is decided in the background and never shown.
  Round 2 draws on the user's references: an "Ember"-style agent card grid and an "AI Command Center" overview.
  Variants via ?variant=A|B|C, ← / → keys, or the pink bar. All data is fake; buttons do nothing real.
  Run: python -m http.server 5178 --directory prototype/dashboard
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Orchestrator dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.45 "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#141416;color:#e7e7ea}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- shared tokens / atoms ---------- */
  :root{--bg:#141416;--panel:#1a1a1d;--card:#202024;--line:#2c2c31;--line2:#38383e;--mute:#8b8b94;--dim:#5f5f68;--blue:#3b82f6;--amber:#f5a524;--green:#22c55e;--red:#ef4444;--violet:#a78bfa}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .s-running{color:#4ade80;background:#22c55e1f}
  .s-review{color:#60a5fa;background:#3b82f61f}
  .s-stuck{color:#f87171;background:#ef44441f}
  .s-queued{color:#a1a1aa;background:#ffffff0f}
  .s-merged{color:#c4b5fd;background:#a78bfa1f}
  .s-running i{animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:#2c2c31;color:#c9c9cf}
  .tag.hi{background:#f5a52426;color:#fbbf24}.tag.ok{background:#22c55e22;color:#4ade80}.tag.info{background:#3b82f626;color:#93c5fd}
  .agent-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .ic-claude{background:#d9775722;color:#f0a07e}.ic-codex{background:#3b82f622;color:#93c5fd}.ic-planner{background:#a78bfa22;color:#c4b5fd}
  .log{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.65;overflow:hidden}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log div.new{animation:fadein .35s}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
  .l-tool{color:#7dd3fc}.l-ok{color:#4ade80}.l-err{color:#f87171}.l-think{color:#8b8b94;font-style:italic}.l-esc{color:#fbbf24;font-weight:600}.l-txt{color:#e7e7ea}
  .btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-amber{background:#f5a5241a;border:1px solid #f5a524aa;color:#fbbf24}
  .btn-ghost{border:1px solid var(--line2);color:#d4d4d8}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}

  /* drawer (shared) */
  #drawer{position:fixed;top:0;right:0;bottom:0;width:520px;background:#18181b;border-left:1px solid var(--line);box-shadow:-30px 0 80px #000a;transform:translateX(105%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column}
  #drawer.open{transform:none}
  #drawer .hd{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  #drawer .bd{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
  #drawer .term{flex:1;background:#0c0c0e;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:0}
  #drawer .attempts div{display:flex;gap:10px;align-items:center;font-size:13px;color:#c9c9cf;padding:6px 0}

  /* switcher (not part of the design) */
  #switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:4px;background:#ff2d75;color:#fff;border-radius:999px;padding:4px;box-shadow:0 8px 30px #0008;font:600 13px system-ui}
  #switcher button{width:30px;height:30px;border-radius:50%;font-size:16px}
  #switcher button:hover{background:#fff3}
  #switcher span{padding:0 10px;min-width:250px;text-align:center}
  #switcher small{opacity:.75;font-weight:500}

  /* =========================================================
     A · COMMAND CENTER — overview first
     ========================================================= */
  .A{height:100vh;display:grid;grid-template-columns:236px 1fr;background:#0f1115}
  .A aside{margin:14px 0 14px 14px;background:#151820;border:1px solid #1f2430;border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
  .A .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 8px 18px}
  .A .brand b{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#a78bfa)}
  .A .sec{font-size:11px;letter-spacing:.08em;color:#5b6478;padding:8px 10px;text-transform:uppercase}
  .A aside a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#9aa3b5;font-size:13.5px}
  .A aside a.on{background:#1f2633;color:#fff}
  .A aside a .c{margin-left:auto;font-size:11.5px;background:#ef4444;color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
  .A .conn{margin-top:auto;display:flex;flex-direction:column;gap:7px;padding:12px 10px 4px;border-top:1px solid #1f2430;font-size:12.5px;color:#9aa3b5}
  .A .conn span{display:flex;gap:8px;align-items:center}
  .A .conn i{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .A main{overflow:auto;padding:28px 32px 90px}
  .A .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .A h1{font-size:24px;letter-spacing:-.02em}
  .A .sub{color:#6b7488;font-size:13px;margin-top:2px}
  .A .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .A .tile{background:#161a22;border:1px solid #222836;border-radius:14px;padding:18px 20px}
  .A .tile b{font-size:34px;letter-spacing:-.03em;display:block;line-height:1.1}
  .A .tile span{color:#7d869a;font-size:13px}
  .A .tile.alert{border-color:#ef444455;background:linear-gradient(180deg,#ef44440d,#161a22)}
  .A .tile.alert b{color:#f87171}
  .A .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
  .A .panel{background:#161a22;border:1px solid #222836;border-radius:14px;padding:18px 20px}
  .A .panel h2{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .A .panel h2 small{font-weight:500;color:#6b7488;font-size:12px}
  .A .act{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #1f2430;cursor:pointer}
  .A .act:first-of-type{border-top:0}
  .A .act .who{font-weight:600;font-size:13.5px}
  .A .act .what{color:#8590a6;font-size:12.5px}
  .A .act .log{margin-top:6px;color:#9aa3b5;font-size:11.5px}
  .A .act .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
  .A .need{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #1f2430}
  .A .need:first-of-type{border-top:0}
  .A .need .t{font-weight:600;font-size:13.5px}
  .A .need .w{color:#8590a6;font-size:12.5px}
  .A .need .btn{margin-left:auto}
  .A .proj{display:grid;grid-template-columns:1fr 120px 60px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid #1f2430}
  .A .proj:first-of-type{border-top:0}
  .A .proj .nm{font-weight:600}
  .A .proj .rp{color:#6b7488;font-size:12px}
  .A .bar{height:7px;background:#232a38;border-radius:99px;overflow:hidden;display:flex;margin-top:8px}
  .A .bar i{display:block;height:100%}
  .A .pct{text-align:right;font-weight:600;color:#c9d1e0}

  /* =========================================================
     B · TICKET CARDS — Ember-style three columns
     ========================================================= */
  .B{height:100vh;display:grid;grid-template-columns:208px 256px 1fr;grid-template-rows:60px 1fr}
  .B .rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .B .brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:2px 8px 22px}
  .B .brand b{width:20px;height:20px;background:#fff;clip-path:polygon(0 0,60% 0,60% 40%,100% 40%,100% 100%,40% 100%,40% 60%,0 60%)}
  .B .rail a{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:9px;font-weight:600;font-size:14px;color:#d4d4d8}
  .B .rail a.on{background:#1e3a5f66;color:#60a5fa;box-shadow:inset 3px 0 0 #3b82f6}
  .B .rail a .c{margin-left:auto;font-size:11px;background:#ef4444;color:#fff;border-radius:99px;padding:0 7px}
  .B .health{margin-top:auto;border:1px solid #1e3a5f;background:#0f1b2a;border-radius:10px;padding:13px;font-size:12px}
  .B .health h4{display:flex;gap:7px;align-items:center;font-size:12.5px;margin-bottom:10px}
  .B .health h4 svg{color:#4ade80;width:14px;height:14px}
  .B .health .r{display:flex;justify-content:space-between;color:#c9c9cf;padding:4px 0}
  .B .health .r em{font-style:normal;font-family:Consolas,monospace;font-size:11.5px;color:#4ade80}
  .B .health .r em.w{color:#fbbf24}
  .B .health .slot{height:5px;border-radius:9px;background:#1f2937;margin:4px 0 8px;overflow:hidden}
  .B .health .slot i{display:block;height:100%;width:75%;background:#f5a524}
  .B .health .ft{color:var(--mute);border-top:1px solid #1e3a5f;margin-top:8px;padding-top:8px;font-size:11px}
  .B header{grid-column:2/4;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:16px}
  .B .search{flex:1;max-width:680px;border:1px solid var(--line2);border-radius:9px;padding:8px 14px;color:var(--dim);display:flex;gap:9px;align-items:center;background:#18181b}
  .B .me{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
  .B .me small{display:block;color:var(--mute);font-weight:500;font-size:12px}
  .B .projs{border-right:1px solid var(--line);padding:22px 16px}
  .B .projs h3{display:flex;justify-content:space-between;font-size:15px;margin:0 0 14px 6px}
  .B .projs a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;color:#d4d4d8;margin-bottom:2px}
  .B .projs a small{display:block;font-weight:500;font-size:11.5px;color:var(--dim)}
  .B .projs a.on{background:#27272b}
  .B .projs a .n{margin-left:auto;color:var(--mute);font-size:12px;font-weight:500}
  .B .projs a .ph{font-size:10.5px;padding:1px 6px;border-radius:5px;margin-left:auto}
  .B .main{overflow:auto;padding:26px 24px 90px}
  .B .bar1{display:flex;gap:14px;margin-bottom:14px}
  .B .filter{flex:1;border:1px solid var(--line2);border-radius:10px;padding:11px 16px;color:var(--dim);display:flex;gap:10px;align-items:center;background:#18181b}
  .B .bar2{display:flex;gap:12px;align-items:center;margin-bottom:22px;color:#c9c9cf;font-weight:600}
  .B .sel{border:1px solid var(--line2);border-radius:9px;padding:9px 14px;min-width:170px;display:flex;justify-content:space-between;align-items:center;background:#1b1b1e;font-weight:500}
  .B .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .B .card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;transition:.15s}
  .B .card:hover{border-color:#45454d}
  .B .card.selc{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f622}
  .B .card .h{display:flex;gap:12px;align-items:flex-start}
  .B .card .h .t{font-weight:700;font-size:16px;line-height:1.3}
  .B .card .h .m{font-size:12.5px;color:var(--mute);margin-top:3px}
  .B .card .h .pill{margin-left:auto}
  .B .card p{color:#b4b4bc;font-size:14px;margin:16px 0}
  .B .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .B .stat{background:#18181b;border:1px solid #2a2a2f;border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-family:Consolas,monospace;font-size:12.5px;color:#d4d4d8}
  .B .stat svg{color:#60a5fa;width:15px;height:15px}
  .B .tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .B .card .live{background:#0c0c0e;border-radius:8px;padding:8px 10px;margin-top:-4px;margin-bottom:14px;height:44px}
  .B .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-around;align-items:center;font-weight:600;font-size:13px}
  .B .foot span{display:flex;gap:7px;align-items:center}
  .B .stuckc{border-color:#ef444466}

  /* =========================================================
     C · PROJECT BOARD — one project, rich cards in columns, live feed
     ========================================================= */
  .C{height:100vh;display:grid;grid-template-columns:64px 1fr 340px;background:#111113}
  .C .rail{background:#161618;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
  .C .rail b{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#f5a524,#ef4444);margin-bottom:16px}
  .C .rail a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#8b8b94}
  .C .rail a.on{background:#27272b;color:#fff}
  .C .rail a svg{width:19px;height:19px}
  .C .center{display:flex;flex-direction:column;min-width:0}
  .C .phead{padding:22px 28px 18px;border-bottom:1px solid var(--line)}
  .C .crumb{color:var(--dim);font-size:12.5px}
  .C .ttl{display:flex;align-items:center;gap:14px;margin-top:4px}
  .C .ttl h1{font-size:22px;letter-spacing:-.02em}
  .C .ttl .btn{margin-left:auto}
  .C .steps{display:flex;align-items:center;gap:0;margin-top:16px}
  .C .step{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute);font-weight:600}
  .C .step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:#27272b}
  .C .step.done{color:#4ade80}.C .step.done i{background:#22c55e26}
  .C .step.now{color:#fff}.C .step.now i{background:var(--blue)}
  .C .steps .ln{width:46px;height:2px;background:#2c2c31;margin:0 10px}
  .C .steps .ln.d{background:#22c55e66}
  .C .prog{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mute)}
  .C .prog .bar{width:220px;height:7px;border-radius:99px;background:#27272b;overflow:hidden;display:flex}
  .C .prog .bar i{height:100%}
  .C .cols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px 90px;overflow:auto}
  .C .col h4{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px;color:#d4d4d8}
  .C .col h4 span{color:var(--dim);font-weight:500}
  .C .card{background:#1c1c1f;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer}
  .C .card:hover{border-color:#45454d}
  .C .card .n{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .C .card .t{font-weight:600;margin:5px 0 10px;font-size:14px}
  .C .card .ag{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
  .C .card .ag .agent-ic{width:24px;height:24px;border-radius:7px}
  .C .card .ag svg{width:13px;height:13px}
  .C .card .mini{display:flex;gap:14px;margin-top:10px;font-family:Consolas,monospace;font-size:11.5px;color:#a1a1aa}
  .C .card .live{background:#0c0c0e;border-radius:8px;padding:7px 9px;margin-top:10px;height:42px}
  .C .card.stk{border-color:#ef444466;background:#1f1416}
  .C .card .acts{display:flex;gap:8px;margin-top:12px}
  .C .feed{border-left:1px solid var(--line);background:#161618;display:flex;flex-direction:column;min-height:0}
  .C .feed h3{font-size:13px;padding:20px 20px 12px;display:flex;align-items:center;gap:8px}
  .C .ev{display:flex;gap:12px;padding:10px 20px;font-size:13px;color:#c9c9cf;position:relative}
  .C .ev::before{content:"";position:absolute;left:31px;top:34px;bottom:-10px;width:1px;background:#2c2c31}
  .C .ev:last-child::before{display:none}
  .C .ev .agent-ic{width:24px;height:24px;border-radius:7px}
  .C .ev .agent-ic svg{width:13px;height:13px}
  .C .ev small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
  .C .ev b{color:#fff;font-weight:600}
  .C .ask{margin:auto 16px 16px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--dim);display:flex;gap:10px;align-items:center;background:#1b1b1e}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer"></div>
<div id="switcher"><button id="prev" title="Previous (←)">‹</button><span id="label"></span><button id="next" title="Next (→)">›</button></div>

<script>
/* ---------------- icons ---------------- */
const I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>',
  grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>',
  ticket:'<svg viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>',
  bot:'<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>',
  pr:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/><path d="m13 5-2 2 2 2"/></svg>',
  pulse:'<svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',

/* ---------------- variant switching ---------------- */
const V = {A:['Command center',A], B:['Ticket cards',B], C:['Project board',C]};
const keys = Object.keys(V);
let variant = (new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
if (!V[variant]) variant = 'A';
function render(){
  $('#app').innerHTML = V[variant][1]();
  $('#label').innerHTML = `${variant} <small>(${V[variant][0]})</small> &nbsp;<small>${keys.indexOf(variant)+1}/${keys.length}</small>`;
  document.title = `PROTOTYPE · ${variant} ${V[variant][0]}`;
  renderLogs();
}
function go(d){
  variant = keys[(keys.indexOf(variant)+d+keys.length)%keys.length];
  try { history.replaceState(null,'','?variant='+variant); } catch { location.search='?variant='+variant; return; }
  drawer(false); render();
}
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1); if (e.key==='Escape') drawer(false);
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return drawer(false);
  const s = e.target.closest('[data-sel]');
  if (s && !e.target.closest('button')) { selected = +s.dataset.sel; render(); drawer(true); }
});

/* ---------------- fake live output ---------------- */
function renderLogs(){
  document.querySelectorAll('[data-log]').forEach(el => {
    const n = el.dataset.log, html = logs[n].slice(-(+el.dataset.lines)).map(fmt).join('');
    if (el.dataset.html === html) return;
    el.dataset.html = html; el.innerHTML = html; el.lastElementChild?.classList.add('new');
  });
}
setInterval(() => {
  for (const k of [12,16,17]) { if (Math.random() < .45) continue; const s = SCRIPTS[k]; logs[k].push(s[cur[k] % s.length]); cur[k]++; }
  renderLogs();
