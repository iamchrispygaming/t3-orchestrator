<!doctype html>
<!--
  PROTOTYPE — throwaway. Wayfinder ticket "What do the other dashboard pages look like, and where does the planning chat sit?"
  Hosted inside the chosen "Ticket cards" shell (see index.html?variant=B). Only STRUCTURE is being judged; styling is provisional.
  Pages: click the left nav (Home, Tickets, Agents, Planner, Activity). Each page has variants A/B/C:
  cycle with the pink bar or ← / →. URL: ?page=home&variant=A (shareable, reload-stable).
  All data is fake; buttons do nothing real. No Cost or quota numbers anywhere (decided).
  Open by double-clicking, or: python -m http.server 5178 --directory prototype/dashboard  →  /pages.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Orchestrator pages</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.45 "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#141416;color:#e7e7ea}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font:inherit;color:inherit}
  .mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  :root{--bg:#141416;--panel:#1a1a1d;--card:#202024;--line:#2c2c31;--line2:#38383e;--mute:#8b8b94;--dim:#5f5f68;--blue:#3b82f6;--amber:#f5a524;--green:#22c55e;--red:#ef4444;--violet:#a78bfa}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .s-running{color:#4ade80;background:#22c55e1f}.s-running i{animation:blink 1.4s infinite}
  .s-reviewing{color:#2dd4bf;background:#14b8a61f}
  .s-awaiting{color:#60a5fa;background:#3b82f61f}
  .s-stuck{color:#f87171;background:#ef44441f}
  .s-queued{color:#a1a1aa;background:#ffffff0f}
  .s-waiting{color:#71717a;background:#ffffff0a}
  .s-merged{color:#c4b5fd;background:#a78bfa1f}
  .s-paused{color:#fbbf24;background:#f5a5241f}
  @keyframes blink{50%{opacity:.25}}
  .tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:#2c2c31;color:#c9c9cf;white-space:nowrap}
  .tag.hi{background:#f5a52426;color:#fbbf24}.tag.ok{background:#22c55e22;color:#4ade80}.tag.info{background:#3b82f626;color:#93c5fd}.tag.red{background:#ef444426;color:#fca5a5}
  .agent-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .agent-ic.sm{width:24px;height:24px;border-radius:7px}.agent-ic.sm svg{width:13px;height:13px}
  .ic-claude{background:#d9775722;color:#f0a07e}.ic-codex{background:#3b82f622;color:#93c5fd}.ic-planner{background:#a78bfa22;color:#c4b5fd}.ic-you{background:#ffffff14;color:#e7e7ea}.ic-sys{background:#ffffff0d;color:#a1a1aa}
  .log{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.65;overflow:hidden}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .l-tool{color:#7dd3fc}.l-ok{color:#4ade80}.l-err{color:#f87171}.l-think{color:#8b8b94;font-style:italic}.l-txt{color:#e7e7ea}
  .btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px}
  .btn-blue{background:var(--blue);color:#fff}.btn-green{background:#16a34a;color:#fff}
  .btn-amber{background:#f5a5241a;border:1px solid #f5a524aa;color:#fbbf24}
  .btn-ghost{border:1px solid var(--line2);color:#d4d4d8}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .muted{color:var(--mute)}.dim{color:var(--dim)}
  h1{font-size:22px;letter-spacing:-.02em}
  .sub{color:var(--mute);font-size:13px;margin-top:2px}
  .panel{background:#1b1b1e;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel h2{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .panel h2 small{font-weight:500;color:var(--mute);font-size:12px}
  .row{display:flex;gap:12px;align-items:center}
  .sep{border-top:1px solid var(--line)}

  /* ---------- shell (the decided Ticket-cards layout) ---------- */
  .shell{height:100vh;display:grid;grid-template-columns:208px 256px 1fr;grid-template-rows:60px 1fr}
  .shell.noproj{grid-template-columns:208px 1fr}
  .rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:2px 8px 22px}
  .brand b{width:20px;height:20px;background:#fff;clip-path:polygon(0 0,60% 0,60% 40%,100% 40%,100% 100%,40% 100%,40% 60%,0 60%)}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:9px;font-weight:600;font-size:14px;color:#d4d4d8;cursor:pointer}
  .rail a:hover{background:#ffffff08}
  .rail a.on{background:#1e3a5f66;color:#60a5fa;box-shadow:inset 3px 0 0 #3b82f6}
  .rail a .c{margin-left:auto;font-size:11px;background:#ef4444;color:#fff;border-radius:99px;padding:0 7px}
  .health{margin-top:auto;border:1px solid #1e3a5f;background:#0f1b2a;border-radius:10px;padding:13px;font-size:12px}
  .health h4{display:flex;gap:7px;align-items:center;font-size:12.5px;margin-bottom:10px}
  .health h4 svg{color:#4ade80;width:14px;height:14px}
  .health .r{display:flex;justify-content:space-between;color:#c9c9cf;padding:3px 0}
  .health .r em{font-style:normal;font-family:Consolas,monospace;font-size:11.5px;color:#4ade80}
  .health .r em.w{color:#fbbf24}
  .health .ft{color:var(--mute);border-top:1px solid #1e3a5f;margin-top:8px;padding-top:8px;font-size:11px}
  header.top{grid-column:2/4;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:16px}
  .noproj header.top{grid-column:2/3}
  .search{flex:1;max-width:680px;border:1px solid var(--line2);border-radius:9px;padding:8px 14px;color:var(--dim);display:flex;gap:9px;align-items:center;background:#18181b}
  .me{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
  .me small{display:block;color:var(--mute);font-weight:500;font-size:12px}
  .projs{border-right:1px solid var(--line);padding:22px 16px;overflow:auto}
  .projs h3{display:flex;justify-content:space-between;font-size:15px;margin:0 0 14px 6px}
  .projs a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;color:#d4d4d8;margin-bottom:2px}
  .projs a small{display:block;font-weight:500;font-size:11.5px;color:var(--dim)}
  .projs a.on{background:#27272b}
  .projs a .n{margin-left:auto;color:var(--mute);font-size:12px;font-weight:500}
  .main{overflow:auto;padding:26px 28px 100px;min-width:0;position:relative}

  /* Tickets page (decided; reference only) */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
  .card .h{display:flex;gap:12px;align-items:flex-start}
  .card .h .t{font-weight:700;font-size:15px;line-height:1.3}
  .card .h .m{font-size:12px;color:var(--mute);margin-top:3px}
  .card .h .pill{margin-left:auto}
  .card p{color:#b4b4bc;font-size:13.5px;margin:12px 0}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px}
  .card .live{background:#0c0c0e;border-radius:8px;padding:8px 10px;margin-top:12px;height:44px}
  .card.stuckc{border-color:#ef444466}

  /* ---------- HOME ---------- */
  .inbox .item{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#1b1b1e;margin-bottom:10px}
  .inbox .item .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .inbox .item .t{font-weight:700;font-size:15px;margin-top:2px}
  .inbox .item .w{color:var(--mute);font-size:13px;margin-top:2px}
  .inbox .item .acts{margin-left:auto;display:flex;gap:8px}
  .quiet{display:flex;gap:22px;color:var(--mute);font-size:13px;padding:14px 16px;border:1px dashed var(--line2);border-radius:12px;margin-top:18px}
  .quiet b{color:#e7e7ea}
  .prow{display:grid;grid-template-columns:240px 1fr 170px;gap:22px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
  .prow:first-of-type{border-top:0}
  .stepper{display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--dim)}
  .stepper span{display:flex;align-items:center;gap:6px}
  .stepper i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;background:#27272b}
  .stepper .d{color:#4ade80}.stepper .d i{background:#22c55e26}
  .stepper .n{color:#fff}.stepper .n i{background:var(--blue)}
  .stepper .ln{width:28px;height:2px;background:#2c2c31;margin:0 8px}
  .segbar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#27272b;margin-top:10px}
  .segbar i{display:block;height:100%}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:2px;display:block}
  .digest{max-width:760px}
  .digest .hero{font-size:26px;line-height:1.3;letter-spacing:-.02em;font-weight:700;margin:6px 0 22px}
  .digest .hero em{font-style:normal;color:#4ade80}.digest .hero u{text-decoration:none;color:#f87171}
  .digest .grp{margin-bottom:24px}
  .digest .grp h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .digest .li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .digest .li:first-of-type{border-top:0}
  .digest .li .when{margin-left:auto;color:var(--dim);font-size:12px}

  /* ---------- AGENTS ---------- */
  .acols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .slot{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#18181b;margin-top:10px}
  .slot.free{border-style:dashed;color:var(--dim);justify-content:center}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .kv:first-child{border-top:0}
  .ladder{max-width:860px}
  .rung{display:grid;grid-template-columns:28px 34px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#1b1b1e;margin-bottom:8px}
  .rung .grip{color:var(--dim);cursor:grab;text-align:center}
  .rung .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .rung.skip{opacity:.55}
  .arrow-up{color:var(--dim);font-size:12px;text-align:center;margin:-2px 0 6px}
  .gantt{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gantt .ax,.gantt .ln{display:grid;grid-template-columns:150px 1fr}
  .gantt .ax{background:#18181b;font-size:11px;color:var(--dim)}
  .gantt .ax div:last-child{display:flex;justify-content:space-between;padding:8px 12px}
  .gantt .ln{border-top:1px solid var(--line);height:54px}
  .gantt .ln .lb{padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
  .gantt .tr{position:relative}
  .gantt .blk{position:absolute;top:10px;height:34px;border-radius:7px;font-size:11.5px;font-weight:600;padding:0 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
  .b-ok{background:#22c55e26;color:#86efac;border:1px solid #22c55e55}
  .b-fail{background:#ef444422;color:#fca5a5;border:1px solid #ef444455}
  .b-run{background:#3b82f626;color:#93c5fd;border:1px dashed #3b82f6aa}
  .b-rev{background:#14b8a622;color:#5eead4;border:1px solid #14b8a655}
  .gantt .now{position:absolute;top:0;bottom:0;right:4%;width:2px;background:#ff2d75aa}

  /* ---------- ACTIVITY ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#c9c9cf}
  .chip.on{background:#3b82f622;border-color:#3b82f6;color:#93c5fd}
  .feed .ev{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:flex-start}
  .feed .ev:first-child{border-top:0}
  .feed .ev b{font-weight:600}
  .feed .ev small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .feed .ev .when{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
  .day{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:18px 0 4px}
  .story{border:1px solid var(--line);border-radius:12px;background:#1b1b1e;padding:14px 16px;margin-bottom:10px}
  .story .hd{display:flex;gap:10px;align-items:center}
  .story .hd .t{font-weight:700}
  .story .hd .pill{margin-left:auto}
  .chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px}
  .chain .st{border-radius:7px;padding:4px 9px;font-weight:600}
  .chain .ar{color:var(--dim)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line2);position:sticky;top:-26px;background:#141416}
  table.t td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.t tr:hover td{background:#ffffff05}

  /* ---------- PLANNER ---------- */
  .chat{display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;align-items:flex-start;max-width:640px}
  .msg .bub{background:#1f1f23;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13.5px}
  .msg.you{margin-left:auto;flex-direction:row-reverse}
  .msg.you .bub{background:#1e3a5f;border-color:#2b4c78}
  .qcard{border:1px solid #a78bfa55;background:#a78bfa0d;border-radius:12px;padding:12px 14px;margin-top:8px}
  .qcard .q{font-weight:700;font-size:13.5px}
  .qcard .rec{font-size:12.5px;color:#c4b5fd;margin-top:4px}
  .qcard .ans{display:flex;gap:8px;margin-top:9px}
  .composer{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--dim);display:flex;gap:10px;align-items:center;background:#18181b}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 60px);margin:-26px -28px -100px}
  .split > div{overflow:auto;padding:22px 24px 90px;display:flex;flex-direction:column;min-height:0}
  .split > div:first-child{border-right:1px solid var(--line)}
  .tk{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .tk .nm{font-weight:600}
  .tk .why{color:var(--dim);font-size:12px}
  .sel{border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:12px;background:#18181b;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .approve{position:sticky;bottom:-90px;margin:18px -24px -90px;padding:14px 24px 22px;background:linear-gradient(180deg,#14141600,#141416 30%);display:flex;gap:10px;align-items:center}
  .scrim{position:fixed;inset:0;background:#0009;z-index:40}
  .slide{position:fixed;top:0;right:0;bottom:0;width:560px;background:#18181b;border-left:1px solid var(--line);box-shadow:-30px 0 80px #000a;z-index:41;display:flex;flex-direction:column}
  .slide .hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
  .slide .bd{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .slide .ft{padding:14px 20px;border-top:1px solid var(--line)}
  .doc{max-width:860px;display:grid;grid-template-columns:1fr 300px;gap:26px}
  .doc .paper{background:#1b1b1e;border:1px solid var(--line);border-radius:12px;padding:26px 30px}
  .doc .paper h2{font-size:17px;margin:22px 0 8px}
  .doc .paper h2:first-child{margin-top:0}
  .doc .paper p{color:#c9c9cf;font-size:14px}
  .doc .side{display:flex;flex-direction:column;gap:12px}
  .round{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#c4b5fd}

  /* =========================================================
     HOME D · OPERATIONS FLOOR (full-bleed, spatial)
     ========================================================= */
  .F{height:100vh;display:flex;flex-direction:column;background:#07090d;color:#dfe6f3;font-family:"Inter","Segoe UI Variable",system-ui,sans-serif;overflow:hidden}
  .F .bar{display:flex;align-items:stretch;gap:8px;padding:8px 10px;border-bottom:1px solid #1a2130;background:linear-gradient(180deg,#0d1119,#090c12)}
  .F .logo{display:flex;flex-direction:column;justify-content:center;padding:0 14px 0 6px;border-right:1px solid #1a2130}
  .F .logo b{font-size:19px;letter-spacing:.06em;font-weight:900;display:flex;align-items:center;gap:10px}
  .F .logo b span{background:linear-gradient(90deg,#e9eef8,#8fb3ff);-webkit-background-clip:text;color:transparent}
  .F .live{font-size:10.5px;font-weight:800;letter-spacing:.08em;background:#16a34a;color:#fff;border-radius:4px;padding:2px 7px;display:flex;align-items:center;gap:5px;-webkit-text-fill-color:#fff}
  .F .live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .F .logo small{font-size:10.5px;color:#f5b94a;font-weight:700;letter-spacing:.03em;margin-top:3px}
  .F .now{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;min-width:0}
  .F .lbl{font-size:10px;letter-spacing:.14em;font-weight:800;color:#6f7d96;text-transform:uppercase}
  .F .now div:last-child{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .F .kpi{border:1px solid #1e2738;background:#0d121b;border-radius:8px;padding:6px 14px;min-width:96px;display:flex;flex-direction:column;justify-content:center}
  .F .kpi b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .F .kpi.red{border-color:#7f1d1d;background:linear-gradient(180deg,#2a0f12,#0d121b)}.F .kpi.red b{color:#f87171}
  .F .kpi.green b{color:#4ade80}.F .kpi.blue b{color:#7fb0ff}
  .F .navi{display:flex;gap:4px;align-items:center;padding-left:6px;border-left:1px solid #1a2130}
  .F .navi a{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#6f7d96;cursor:pointer}
  .F .navi a:hover,.F .navi a.on{background:#151c29;color:#cfe0ff}
  .F .floor{flex:1;display:grid;grid-template-rows:1fr 1fr 1fr;gap:6px;padding:6px;min-height:0}
  .F .rowr{display:grid;gap:6px;min-height:0}
  .F .room{position:relative;border-radius:6px;overflow:hidden;border:1px solid #232c3d;cursor:pointer;min-height:0;transition:.15s;box-shadow:inset 0 0 0 1px #ffffff06}
  .F .room:hover{border-color:#4b5b7a;transform:translateY(-1px)}
  .F .room.alert{border-color:#b91c1c;box-shadow:0 0 0 1px #b91c1c66,0 0 22px #ef444430}
  .F .room.wait{border-color:#b7791f;box-shadow:0 0 0 1px #b7791f55,0 0 18px #f5a52422}
  .F .rt{position:absolute;top:0;left:0;right:0;height:22px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;z-index:3;background:linear-gradient(180deg,#000a,#0000)}
  .F .rt svg{width:13px;height:13px}
  .F .dot{position:absolute;top:28px;right:10px;width:9px;height:9px;border-radius:50%;z-index:3;box-shadow:0 0 8px currentColor;background:currentColor}

/* ---------------- page + variant switching ---------------- */
const PAGES = {home:['Home',Home], tickets:['Tickets',Tickets], agents:['Agents',Agents], planner:['Planner',Planner], activity:['Activity',Activity]};
const qs = new URLSearchParams(location.search);
let page = PAGES[qs.get('page')] ? qs.get('page') : 'home';
let variant = (qs.get('variant')||(page==='home'?'D':'A')).toUpperCase();
function fix(){ if (!PAGES[page][1][variant]) variant = 'A'; }
function render(){
  fix();
  const V = PAGES[page][1], keys = Object.keys(V);
  $('#app').innerHTML = V[variant][1]();
  $('#label').innerHTML = `${PAGES[page][0]} · ${variant} <small>(${V[variant][0]})</small> &nbsp;<small>${keys.indexOf(variant)+1}/${keys.length}</small>`;
  document.title = `PROTOTYPE · ${PAGES[page][0]} ${variant}`;
  const u = `?page=${page}&variant=${variant}`;
  try { history.replaceState(null,'',u); } catch {}
}
function go(d){ const keys = Object.keys(PAGES[page][1]); variant = keys[(keys.indexOf(variant)+d+keys.length)%keys.length]; render(); }
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1);
});
document.addEventListener('click', e => { const p = e.target.closest('[data-page]'); if (p){ page = p.dataset.page; variant = page==='home'?'D':'A'; render(); } });
render();
</script>
